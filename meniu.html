<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cristi's Hotel Menu</title>
  <link rel="stylesheet" href="meniu.css">
</head>
<body>

  <header>
    <div class="header">
      <h1>Cristi's Hotel</h1>
      <p>Our Menu</p>
    </div>
  </header>

  <main>
    <section class="meniu" id="mancare">
      <h2 class="section-title">Food</h2>
      <div class="meniurile">
        <div class="meniuri">
          <img src="assets/supa.png" alt="Chicken soup">
          <h2>Chicken soup</h2>
          <h3>25 RON</h3>
        </div>
        <div class="meniuri">
          <img src="assets/friptura.png" alt="Roast beef">
          <h2>Roast beef</h2>
          <h3>47 RON</h3>
        </div>
        <div class="meniuri">
        <img src="assets/burger.png" alt="Burger">
        <h2>Burger</h2>
        <h3>55 RON</h3>
      </div>
      </div>
    </section>

    <section class="meniu" id="drink">
      <h2 class="section-title">Drink</h2>
      <div class="meniurile">
        <div class="meniuri">
          <img src="assets/apa.png" alt="Water">
          <h2>Water</h2>
          <h3>7 RON</h3>
        </div>
        <div class="meniuri">
          <img src="assets/vin.png" alt="White wine">
          <h2>White wine</h2>
          <h3>80 RON</h3>
        </div>
        <div class="meniuri">
        <img src="assets/cola.png" alt="Cola">
        <h2>Coca-Cola</h2>
        <h3>10 RON</h3>
      </div>
      </div>
    </section>

    <section class="meniu" id="desert">
      <h2 class="section-title">Desert</h2>
      <div class="meniurile">
        <div class="meniuri">
          <img src="assets/clatite.png" alt="Pancakes">
          <h2>Pancakes</h2>
          <h3>25 RON</h3>
        </div>
        <div class="meniuri">
          <img src="assets/inghetata.png" alt="Ice cream">
          <h2>Ice cream</h2>
          <h3>16 RON</h3>
        </div>
        <div class="meniuri">
        <img src="assets/tiramisu.png" alt="Tiramisu">
        <h2>Tiramisu</h2>
        <h3>55 RON</h3>
      </div>
      </div>
    </section>
  </main>

 
</body>
</html>
